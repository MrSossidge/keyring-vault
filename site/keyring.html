<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Keyring</title>
<style>
:root{
  --bg:#0f1115; --bg2:#161a21; --bg3:#1d222b; --line:#272d38; --line2:#333b48;
  --fg:#e6e9ef; --fg2:#9aa4b4; --fg3:#6b7686;
  --accent:#5b9dff; --accent2:#1b2b45;
  --ok:#3ecf8e; --warn:#f0b429; --bad:#f2555a;
  --radius:10px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#ffffff; --bg3:#eef1f5; --line:#dde2ea; --line2:#c9d1dd;
  --fg:#161a21; --fg2:#5a6472; --fg3:#8a94a4;
  --accent:#2563eb; --accent2:#e2ecff;
  --ok:#137a52; --warn:#9a6700; --bad:#c62b30;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
svg{width:16px;height:16px;flex:none;vertical-align:middle}
.rhead .chev{width:15px;height:15px}
.hide{display:none !important}

/* ---------- gate screens ---------- */
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:28px}
.gate-card h1{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}
.gate-card p.sub{margin:0 0 20px;color:var(--fg2);font-size:13px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand svg{width:26px;height:26px;color:var(--accent)}
.brand span{font-size:17px;font-weight:600;letter-spacing:-.02em}

/* ---------- form bits ---------- */
label.f{display:block;margin-bottom:14px}
label.f > .lab{display:block;font-size:12px;font-weight:600;color:var(--fg2);margin-bottom:5px;letter-spacing:.01em}
input[type=text],input[type=password],input[type=date],input[type=url],textarea,select{
  width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;transition:border-color .12s,box-shadow .12s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
textarea{resize:vertical;min-height:70px}
.mono{font-family:var(--mono);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--line2);border-radius:8px;padding:8px 13px;cursor:pointer;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--line);border-color:var(--fg3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--bad);border-color:var(--line2)}
.btn.danger:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.full{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:none}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--fg2);cursor:pointer;flex:none;transition:all .12s}
.iconbtn:hover{background:var(--bg3);color:var(--fg);border-color:var(--line)}
.iconbtn.ok{color:var(--ok)}
.iconbtn svg{width:16px;height:16px}
.err{color:var(--bad);font-size:13px;margin:-6px 0 12px;min-height:18px}
.hint{color:var(--fg3);font-size:12px;margin-top:6px}
.pwwrap{position:relative}
.pwwrap .iconbtn{position:absolute;right:5px;top:50%;transform:translateY(-50%)}
.pwwrap input{padding-right:40px}
.meter{height:4px;border-radius:3px;background:var(--bg3);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--bad);transition:width .2s,background .2s}

/* ---------- app shell ---------- */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.searchwrap{position:relative;flex:1;min-width:120px}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--fg3);pointer-events:none}
.searchwrap input{padding-left:34px}
main{max-width:1120px;margin:0 auto;padding:18px 20px 80px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.spacer{flex:1}
.count{color:var(--fg3);font-size:12.5px}
.tags-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--fg2);cursor:pointer;transition:all .12s}
.chip:hover{border-color:var(--fg3);color:var(--fg)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- entry list ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:border-color .12s}
.row:hover{border-color:var(--line2)}
.row.open{border-color:var(--accent)}
.rhead{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.rhead .chev{color:var(--fg3);transition:transform .15s;flex:none}
.row.open .rhead .chev{transform:rotate(90deg)}
.rmain{flex:1;min-width:0}
.rname{font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rmeta{color:var(--fg2);font-size:12.5px;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.rmeta b{color:var(--fg3);font-weight:500}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid}
.badge.exp{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.badge.soon{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.badge.tag{color:var(--fg2);border-color:var(--line2);text-transform:none;letter-spacing:0;font-weight:600}
.ract{display:flex;align-items:center;gap:2px;flex:none}
.rbody{border-top:1px solid var(--line);padding:6px 14px 14px;background:var(--bg)}
.fld{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.fld:last-child{border-bottom:0}
.fld .k{width:96px;flex:none;color:var(--fg3);font-size:12px;font-weight:600;padding-top:5px;letter-spacing:.01em}
.fld .v{flex:1;min-width:0;word-break:break-all;padding-top:3px}
.fld .v.secret{font-family:var(--mono);font-size:13px;background:var(--bg3);border:1px solid var(--line);border-radius:7px;padding:7px 10px;letter-spacing:.02em}
.fld .a{display:flex;gap:2px;flex:none}
.notes{white-space:pre-wrap;color:var(--fg2)}
.empty{text-align:center;padding:70px 20px;color:var(--fg3)}
.empty svg{width:40px;height:40px;margin-bottom:14px;opacity:.5}
.empty h3{color:var(--fg2);font-weight:600;margin:0 0 6px;font-size:15px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:600px;margin:auto}
.mhead{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mhead h2{margin:0;font-size:16px;font-weight:600;flex:1;letter-spacing:-.01em}
.mbody{padding:20px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}.fld{flex-wrap:wrap}.fld .k{width:100%;padding-top:0}}

input[type=file]{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;cursor:pointer}
input[type=file]::file-selector-button{background:var(--bg2);color:var(--fg);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;margin-right:10px;cursor:pointer;font:inherit}
@media(max-width:620px){.btn .lbl{display:none}.top-in .brand span{display:none}main{padding-left:14px;padding-right:14px}.top-in{padding-left:14px;padding-right:14px}}
/* ---------- misc ---------- */
.banner{border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px;border:1px solid;display:flex;gap:10px;align-items:flex-start}
.banner svg{width:17px;height:17px;flex:none;margin-top:1px}
.banner.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.banner.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.banner b{display:block;margin-bottom:3px;color:inherit}
.banner code{font-family:var(--mono);font-size:12px;background:rgba(127,127,127,.18);padding:1px 5px;border-radius:4px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:all .22s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:5px;min-width:210px;z-index:60;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.menu button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left;color:var(--fg)}
.menu button:hover{background:var(--bg3)}
.menu button svg{width:15px;height:15px;color:var(--fg2);flex:none}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.rel{position:relative}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast"></div>
<script>
"use strict";
/* ============================================================
   Keyring — self-hosted API key vault
   Single file. No network calls. No external dependencies.
   Data lives in this browser's localStorage, encrypted with
   AES-256-GCM using a key derived from your master password
   (PBKDF2-SHA256).
   ============================================================ */

/* ---------------- icons ---------------- */
const I = {
  key:'<path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M17.9 17.9A10.1 10.1 0 0112 19c-6.4 0-10-7-10-7a18.5 18.5 0 015.1-5.9m3.1-1.6A10.1 10.1 0 0112 5c6.4 0 10 7 10 7a18.6 18.6 0 01-2.3 3.3M1 1l22 22"/><path d="M9.9 9.9a3 3 0 104.2 4.2"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  edit:'<path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>',
  search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  chev:'<polyline points="9 18 15 12 9 6"/>',
  link:'<path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 110-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 3.6 1.65 1.65 0 0010 2.09V2a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 8v0a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  alert:'<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  down:'<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  up:'<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  moon:'<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>',
  sun:'<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>',
  inbox:'<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/>'
};
function svg(name, cls){
  return '<svg class="'+(cls||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+I[name]+'</svg>';
}

/* ---------------- utils ---------------- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.prototype.slice.call((r||document).querySelectorAll(s));
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'k_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function today(){ return new Date().toISOString().slice(0,10); }
function daysUntil(d){ if(!d) return null; const t=new Date(d+'T00:00:00'); if(isNaN(t)) return null; return Math.ceil((t-new Date(new Date().toDateString()))/86400000); }
let toastT;
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1900);
}
function b64(u8){ let s=''; for(let i=0;i<u8.length;i++) s+=String.fromCharCode(u8[i]); return btoa(s); }
function ub64(str){ const bin=atob(str); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); return u8; }

/* clipboard: navigator.clipboard needs a secure context (https:// or
   localhost or file://). Over plain http on a LAN IP it is undefined,
   so fall back to the old execCommand trick, which still works there. */
async function copyText(t){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(t); return true; }
  }catch(e){ /* fall through */ }
  try{
    const ta=document.createElement('textarea');
    ta.value=t; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:-1000px;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0,t.length);
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
let clipT;
function scheduleClipboardClear(){
  if(!S.settings.clipClear) return;
  clearTimeout(clipT);
  clipT=setTimeout(()=>{ copyText(' '); }, S.settings.clipClear*1000);
}

/* ---------------- crypto ---------------- */
const TE=new TextEncoder(), TD=new TextDecoder();
const KDF_ITER = 310000;
const HAS_CRYPTO = !!(window.crypto && window.crypto.subtle && window.crypto.subtle.deriveKey);

async function deriveKey(password, saltU8, iter){
  const base = await crypto.subtle.importKey('raw', TE.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:saltU8, iterations:iter||KDF_ITER, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptPayload(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, TE.encode(JSON.stringify(obj)));
  return {iv:b64(iv), ct:b64(new Uint8Array(ct))};
}
async function decryptPayload(key, ivB64, ctB64){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:ub64(ivB64)}, key, ub64(ctB64));
  return JSON.parse(TD.decode(pt));
}
function pwStrength(p){
  let s=0;
  if(p.length>=8) s++; if(p.length>=12) s++; if(p.length>=16) s++;
  if(/[a-z]/.test(p)&&/[A-Z]/.test(p)) s++;
  if(/\d/.test(p)) s++; if(/[^A-Za-z0-9]/.test(p)) s++;
  return Math.min(s,6);
}
function genPassphrase(){
  const w=['amber','harbour','quartz','lantern','tundra','copper','willow','meadow','cobalt','pylon','vessel','marrow','thistle','beacon','anvil','fathom','granite','juniper','kestrel','lattice','nimbus','orchard','plinth','ravine'];
  const pick=()=>w[crypto.getRandomValues(new Uint32Array(1))[0]%w.length];
  const n=crypto.getRandomValues(new Uint32Array(1))[0]%90+10;
  return pick()+'-'+pick()+'-'+pick()+'-'+n;
}

/* ---------------- storage ---------------- */
const LS_VAULT='keyring.vault.v1';
const LS_THEME='keyring.theme';
function loadRecord(){
  try{ const raw=localStorage.getItem(LS_VAULT); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function saveRecord(rec){
  try{ localStorage.setItem(LS_VAULT, JSON.stringify(rec)); return true; }
  catch(e){ toast('Could not save — storage blocked or full'); return false; }
}

/* ---------------- sync ---------------- */
/* The server only ever sees the AES-GCM blob. Everything below
   encrypts before it leaves and decrypts after it arrives. */
const LS_SYNC='keyring.sync.v1';
const SYNC = {
  supported:false, on:null, base:'/api/vault', token:'',
  rev:null, remote:null, status:'local', err:null, busy:false
};
function loadSyncCfg(){
  try{
    const r=JSON.parse(localStorage.getItem(LS_SYNC)||'null');
    if(r){ SYNC.base=r.base||SYNC.base; SYNC.token=r.token||''; SYNC.on=r.on!==false; }
  }catch(e){}
}
function saveSyncCfg(){
  try{ localStorage.setItem(LS_SYNC, JSON.stringify({base:SYNC.base, token:SYNC.token, on:SYNC.on!==false})); }catch(e){}
}
function syncHeaders(extra){
  const h=Object.assign({'Content-Type':'application/json'}, extra||{});
  if(SYNC.token) h['Authorization']='Bearer '+SYNC.token;
  return h;
}
async function syncProbe(extra){
  const r=await fetch(SYNC.base, {headers:syncHeaders(extra), cache:'no-store'});
  if(r.headers.get('X-Keyring-Api')!=='1') throw new Error('notapi');
  return r;
}
async function syncInit(){
  loadSyncCfg();
  if(location.protocol==='file:'){ SYNC.status='local'; return; }
  let r;
  try{ r=await syncProbe(); }
  catch(e){ SYNC.status = e.message==='notapi' ? 'local' : 'offline'; return; }
  SYNC.supported=true;
  if(SYNC.on===null){ SYNC.on=true; saveSyncCfg(); }
  if(r.status===401){ SYNC.status='auth'; return; }
  if(!SYNC.on){ SYNC.status='paused'; return; }
  if(r.status===200){
    try{ SYNC.remote=await r.json(); SYNC.rev=r.headers.get('ETag'); SYNC.status='ok'; }
    catch(e){ SYNC.status='error'; SYNC.err='bad response'; }
  } else if(r.status===404){ SYNC.remote=null; SYNC.rev=null; SYNC.status='ok'; }
  else { SYNC.status='error'; SYNC.err='http '+r.status; }
}
function normPayload(p){
  if(!p||typeof p!=='object') return {schema:2, entries:[], deleted:[], settings:{}};
  return {schema:2, entries:Array.isArray(p.entries)?p.entries:[],
          deleted:Array.isArray(p.deleted)?p.deleted:[], settings:p.settings||{}};
}
/* last-write-wins per entry id, with tombstones so a delete on one
   device does not get resurrected by another device's stale copy */
function mergePayloads(a,b){
  a=normPayload(a); b=normPayload(b);
  const tomb=new Map();
  a.deleted.concat(b.deleted).forEach(t=>{
    if(!t||!t.id) return;
    const c=tomb.get(t.id);
    if(!c || String(t.at||'')>String(c.at||'')) tomb.set(t.id,t);
  });
  const m=new Map();
  a.entries.concat(b.entries).forEach(e=>{
    if(!e||!e.id) return;
    const c=m.get(e.id);
    if(!c || String(e.updated||'')>String(c.updated||'')) m.set(e.id,e);
  });
  tomb.forEach((t,id)=>{
    const e=m.get(id);
    if(e && String(t.at||'')>String(e.updated||'')) m.delete(id);
  });
  const cutoff=new Date(Date.now()-90*86400000).toISOString();
  return {schema:2, entries:Array.from(m.values()),
          deleted:Array.from(tomb.values()).filter(t=>String(t.at||'')>cutoff),
          settings:Object.keys(b.settings||{}).length?b.settings:a.settings};
}
async function syncPull(){
  const r=await syncProbe();
  if(r.status===200){ SYNC.rev=r.headers.get('ETag'); return await r.json(); }
  if(r.status===404){ SYNC.rev=null; return null; }
  throw new Error('http'+r.status);
}
async function putRecord(){
  return fetch(SYNC.base, {method:'PUT', headers:syncHeaders({'If-Match':SYNC.rev||'*'}), body:JSON.stringify(S.rec)});
}
async function syncPush(){
  if(!SYNC.on || !SYNC.supported || !S.rec) return;
  SYNC.busy=true; paintBadge();
  try{
    const r=await putRecord();
    if(r.status===409){ await resolveConflict(); }
    else if(r.status===401){ SYNC.status='auth'; SYNC.on=false; saveSyncCfg(); toast('Sync token rejected'); }
    else if(!r.ok){
      const j=await r.json().catch(()=>({}));
      SYNC.status='error'; SYNC.err=j.error||('http '+r.status);
      toast(j.error==='plaintext_refused' ? 'Server refuses unencrypted vaults' : 'Sync failed — saved locally');
    } else { SYNC.rev=r.headers.get('ETag'); SYNC.status='ok'; SYNC.err=null; }
  }catch(e){ SYNC.status='offline'; SYNC.err='unreachable'; }
  SYNC.busy=false; paintBadge();
}
let pushT;
function pushSoon(){ clearTimeout(pushT); pushT=setTimeout(syncPush, 400); }

async function resolveConflict(){
  let remote;
  try{ remote=await syncPull(); }catch(e){ SYNC.status='error'; return; }
  if(!remote){ const r=await putRecord(); if(r.ok){ SYNC.rev=r.headers.get('ETag'); SYNC.status='ok'; } return; }
  if(S.encrypted && S.key && remote.enc===true){
    try{
      const rp=await decryptPayload(S.key, remote.iv, remote.ct);
      const merged=mergePayloads(rp, payloadNow());
      S.entries=merged.entries; S.deleted=merged.deleted;
      S.rec=await buildRecord(merged); saveRecord(S.rec);
      const r=await putRecord();
      if(r.ok){
        SYNC.rev=r.headers.get('ETag'); SYNC.status='ok';
        if($('#list')) renderList();
        toast('Merged changes from another device');
        return;
      }
    }catch(e){ /* different master password — fall through */ }
  }
  conflictModal(remote);
}

let pollT;
function startPoll(){
  clearInterval(pollT);
  if(!SYNC.on || !SYNC.supported) return;
  pollT=setInterval(async()=>{
    if(SYNC.busy) return;
    if(S.encrypted && !S.key) return;
    try{
      const r=await syncProbe({'If-None-Match': SYNC.rev||''});
      if(r.status!==200) return;
      const tag=r.headers.get('ETag');
      if(!tag || tag===SYNC.rev) return;
      const remote=await r.json(); SYNC.rev=tag;
      if(remote.enc!==true || !S.key) return;
      const rp=await decryptPayload(S.key, remote.iv, remote.ct);
      const before=JSON.stringify(payloadNow().entries.map(e=>[e.id,e.updated]).sort());
      const merged=mergePayloads(rp, payloadNow());
      const after=JSON.stringify(merged.entries.map(e=>[e.id,e.updated]).sort());
      if(before!==after){
        S.entries=merged.entries; S.deleted=merged.deleted;
        await persist(); if($('#list')) renderList();
        toast('Updated from another device');
      }
    }catch(e){}
  }, 60000);
}

function badgeInfo(){
  if(!SYNC.supported) return {c:'var(--fg3)', t:'Local only — no sync server on this origin'};
  if(SYNC.busy)  return {c:'var(--accent)', t:'Syncing…'};
  switch(SYNC.status){
    case 'ok':      return {c:'var(--ok)',   t:'Synced with '+location.host};
    case 'paused':  return {c:'var(--fg3)',  t:'Sync paused'};
    case 'auth':    return {c:'var(--warn)', t:'Sync needs a token'};
    case 'offline': return {c:'var(--warn)', t:'Sync server unreachable — saving locally'};
    case 'error':   return {c:'var(--bad)',  t:'Sync error: '+(SYNC.err||'')};
    default:        return {c:'var(--fg3)',  t:'Local only'};
  }
}
function paintBadge(){
  const b=$('#syncdot'); if(!b) return;
  const i=badgeInfo();
  b.style.background=i.c; b.parentNode.title=i.t;
}

/* ---------------- state ---------------- */
const S = {
  key:null,            // CryptoKey, held in memory only
  rec:null,            // the stored record (salt/iv/ct or plaintext)
  entries:[],
  deleted:[],          // tombstones, so deletes survive a merge
  usedRemote:false,
  settings:{autolock:15, clipClear:0},
  encrypted:true,
  q:'', tag:null, sort:'name',
  open:new Set(), shown:new Set(),
  dirtyTimer:null
};

/* ---------------- persistence ---------------- */
function payloadNow(){
  return {schema:2, entries:S.entries, deleted:S.deleted, settings:S.settings};
}
async function buildRecord(payload){
  if(S.encrypted){
    const {iv,ct} = await encryptPayload(S.key, payload);
    return {v:1, enc:true, kdf:{salt:S.rec.kdf.salt, iterations:S.rec.kdf.iterations, hash:'SHA-256'},
            iv, ct, updated:new Date().toISOString()};
  }
  return {v:1, enc:false, data:payload, updated:new Date().toISOString()};
}
async function persist(opts){
  if(S.encrypted && !S.key) return;
  S.rec = await buildRecord(payloadNow());
  saveRecord(S.rec);
  if(SYNC.on && SYNC.supported && !(opts&&opts.noPush)) pushSoon();
}

/* ---------------- auto-lock ---------------- */
let idleT;
function resetIdle(){
  clearTimeout(idleT);
  const m = S.settings.autolock;
  if(!m || m<=0) return;
  idleT = setTimeout(()=>{ if(S.encrypted) lock(true); }, m*60000);
}
function lock(auto){
  S.key=null; S.entries=[]; S.deleted=[]; S.open.clear(); S.shown.clear();
  clearTimeout(idleT);
  closeModal();
  renderGate();
  if(auto) toast('Locked after inactivity');
}
['mousemove','keydown','click','scroll','touchstart'].forEach(ev=>
  document.addEventListener(ev, ()=>{ if(S.key) resetIdle(); }, {passive:true}));

/* ---------------- theme ---------------- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem(LS_THEME,t); }catch(e){}
}
function currentTheme(){
  try{ return localStorage.getItem(LS_THEME) || 'dark'; }catch(e){ return 'dark'; }
}

/* ---------------- gate: setup / unlock ---------------- */
function insecureBanner(){
  if(HAS_CRYPTO) return '';
  return '<div class="banner bad">'+svg('alert')+'<div><b>Encryption unavailable on this address</b>'+
    'Browsers only expose the WebCrypto API on a <em>secure context</em>. This page is on <code>'+esc(location.protocol+'//'+location.host)+'</code>, which is not one. '+
    'Serve it over <code>https://</code>, open it from <code>localhost</code>, or open the file directly with <code>file://</code>. '+
    'You can continue without encryption, but the keys will be stored as plain text in this browser.</div></div>';
}

function renderGate(){
  const local  = loadRecord();
  const remote = (SYNC.on && SYNC.supported) ? SYNC.remote : null;
  let rec = local; S.usedRemote=false;
  if(remote && (!local || String(remote.updated||'')>String(local.updated||''))){ rec=remote; S.usedRemote=true; }
  S.rec = rec;
  const app=$('#app');
  const brand='<div class="brand">'+svg('key')+'<span>Keyring</span></div>';

  if(!rec){
    app.innerHTML='<div class="gate"><div class="gate-card">'+brand+
      '<h1>Create your vault</h1><p class="sub">Pick a master password. It never leaves this browser and it is the only way in — there is no reset and no recovery.</p>'+
      insecureBanner()+
      '<label class="f"><span class="lab">Master password</span><div class="pwwrap"><input id="p1" type="password" autocomplete="new-password" spellcheck="false"><button class="iconbtn" data-peek="p1" type="button">'+svg('eye')+'</button></div><div class="meter"><i id="mtr"></i></div>'+
      '<div class="hint">Long beats complicated. <a href="#" id="gen">Generate a passphrase</a></div></label>'+
      '<label class="f"><span class="lab">Confirm</span><div class="pwwrap"><input id="p2" type="password" autocomplete="new-password" spellcheck="false"><button class="iconbtn" data-peek="p2" type="button">'+svg('eye')+'</button></div></label>'+
      '<div class="err" id="gerr"></div>'+
      '<button class="btn primary full" id="go">'+svg('lock')+'Create vault</button>'+
      (HAS_CRYPTO?'':'<div style="text-align:center;margin-top:12px"><a href="#" id="noenc">Continue without encryption</a></div>')+
      '</div></div>';
    wirePeek();
    $('#p1').addEventListener('input',e=>{
      const s=pwStrength(e.target.value), m=$('#mtr');
      m.style.width=(s/6*100)+'%';
      m.style.background = s<=2?'var(--bad)': s<=4?'var(--warn)':'var(--ok)';
    });
    $('#gen').addEventListener('click',e=>{
      e.preventDefault();
      if(!HAS_CRYPTO){ toast('Needs a secure context'); return; }
      const p=genPassphrase(); $('#p1').value=p; $('#p2').value=p;
      $('#p1').type='text'; $('#p2').type='text';
      $('#p1').dispatchEvent(new Event('input'));
      toast('Write this down somewhere safe');
    });
    const create=async(useEnc)=>{
      const a=$('#p1').value, b=$('#p2').value, err=$('#gerr');
      if(useEnc){
        if(a.length<8){ err.textContent='Use at least 8 characters.'; return; }
        if(a!==b){ err.textContent='The two passwords do not match.'; return; }
      }
      S.entries=[]; S.deleted=[]; S.settings={autolock:15, clipClear:0}; S.encrypted=useEnc;
      if(useEnc){
        const salt=crypto.getRandomValues(new Uint8Array(16));
        S.rec={v:1, enc:true, kdf:{salt:b64(salt), iterations:KDF_ITER, hash:'SHA-256'}, iv:'', ct:''};
        S.key=await deriveKey(a, salt, KDF_ITER);
      } else { S.rec={v:1, enc:false, data:null}; S.key=null; }
      await persist(); renderApp(); resetIdle(); startPoll();
    };
    $('#go').addEventListener('click',()=>create(HAS_CRYPTO));
    $('#p2').addEventListener('keydown',e=>{ if(e.key==='Enter') create(HAS_CRYPTO); });
    if(!HAS_CRYPTO) $('#noenc').addEventListener('click',e=>{e.preventDefault(); create(false);});
    setTimeout(()=>$('#p1').focus(),40);
    return;
  }

  if(rec.enc===false){
    S.encrypted=false; S.key=null;
    const p=normPayload(rec.data);
    S.entries=p.entries; S.deleted=p.deleted;
    S.settings=Object.assign({autolock:15,clipClear:0}, p.settings);
    renderApp(); startPoll(); return;
  }

  S.encrypted=true;
  app.innerHTML='<div class="gate"><div class="gate-card">'+brand+
    '<h1>Unlock</h1><p class="sub">Enter your master password to decrypt the vault.</p>'+
    (HAS_CRYPTO?'':'<div class="banner bad">'+svg('alert')+'<div><b>Cannot decrypt here</b>This vault is encrypted, but WebCrypto is not available on <code>'+esc(location.protocol+'//'+location.host)+'</code>. Open the page over https, from localhost, or as a file:// URL.</div></div>')+
    '<label class="f"><span class="lab">Master password</span><div class="pwwrap"><input id="p1" type="password" autocomplete="current-password" spellcheck="false"'+(HAS_CRYPTO?'':' disabled')+'><button class="iconbtn" data-peek="p1" type="button">'+svg('eye')+'</button></div></label>'+
    '<div class="err" id="gerr"></div>'+
    '<button class="btn primary full" id="go"'+(HAS_CRYPTO?'':' disabled')+'>'+svg('lock')+'Unlock</button>'+
    '<div class="hint" style="text-align:center;margin-top:14px">'+(rec.updated?('Last saved '+esc(new Date(rec.updated).toLocaleString())):'')+'</div>'+
    '</div></div>';
  wirePeek();
  const tryUnlock=async()=>{
    const err=$('#gerr'); const btn=$('#go');
    btn.disabled=true; err.textContent='';
    try{
      const key=await deriveKey($('#p1').value, ub64(rec.kdf.salt), rec.kdf.iterations||KDF_ITER);
      const payload=normPayload(await decryptPayload(key, rec.iv, rec.ct));
      S.key=key; S.entries=payload.entries; S.deleted=payload.deleted;
      S.settings=Object.assign({autolock:15,clipClear:0}, payload.settings);
      renderApp(); resetIdle(); startPoll();
      reconcileAfterUnlock();
    }catch(e){
      err.textContent='Wrong password.'; btn.disabled=false;
      $('#p1').select();
    }
  };
  if(HAS_CRYPTO){
    $('#go').addEventListener('click',tryUnlock);
    $('#p1').addEventListener('keydown',e=>{ if(e.key==='Enter') tryUnlock(); });
    setTimeout(()=>$('#p1').focus(),40);
  }
}
/* We may have unlocked against the server copy while this browser held
   its own (or vice versa). Fold the other one in, then push the result. */
async function reconcileAfterUnlock(){
  if(!SYNC.on || !SYNC.supported) return;
  const other = S.usedRemote ? loadRecord() : SYNC.remote;
  if(other && other.enc===true && S.key && other!==S.rec){
    try{
      const op=normPayload(await decryptPayload(S.key, other.iv, other.ct));
      const merged=mergePayloads(op, payloadNow());
      S.entries=merged.entries; S.deleted=merged.deleted;
      if($('#list')) renderList();
    }catch(e){ /* other copy uses a different password — leave it alone */ }
  }
  await persist();
}

function wirePeek(){
  $$('[data-peek]').forEach(b=>b.addEventListener('click',()=>{
    const inp=$('#'+b.dataset.peek);
    inp.type = inp.type==='password' ? 'text' : 'password';
    b.innerHTML = svg(inp.type==='password'?'eye':'eyeoff');
  }));
}

/* ---------------- main app ---------------- */
function renderApp(){
  $('#app').innerHTML =
    '<header class="top"><div class="top-in">'+
      '<div class="brand" style="margin:0;gap:8px">'+svg('key')+'<span>Keyring</span></div>'+
      '<div class="searchwrap">'+svg('search')+'<input id="q" type="text" placeholder="Search name, issuer, app, stack, tags, notes…" spellcheck="false" autocomplete="off"></div>'+
      '<button class="btn primary" id="add">'+svg('plus')+'<span class="lbl">Add</span></button>'+
      '<button class="iconbtn" id="syncbtn" title="Sync"><span id="syncdot" style="width:9px;height:9px;border-radius:50%;background:var(--fg3);display:block"></span></button>'+
      '<div class="rel"><button class="iconbtn" id="menubtn" title="Menu">'+svg('gear')+'</button></div>'+
      (S.encrypted?'<button class="iconbtn" id="lockbtn" title="Lock vault">'+svg('lock')+'</button>':'')+
    '</div></header>'+
    '<main>'+
      (S.encrypted?'':'<div class="banner warn">'+svg('alert')+'<div><b>This vault is not encrypted</b>Keys are stored as plain text in this browser because WebCrypto was unavailable when the vault was created. Open the page over https or from localhost, then use the menu → <em>Enable encryption</em>.</div></div>')+
      '<div class="bar"><span class="count" id="count"></span><div class="spacer"></div>'+

  $('#q').value=S.q; $('#sort').value=S.sort;
  $('#q').addEventListener('input',e=>{ S.q=e.target.value; renderList(); });
  $('#sort').addEventListener('change',e=>{ S.sort=e.target.value; renderList(); });
  $('#add').addEventListener('click',()=>entryForm(null));

  if($('#lockbtn')) $('#lockbtn').addEventListener('click',()=>lock(false));

function globalKeys(e){
  if(!S.key && S.encrypted) return;
  if(e.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){
    e.preventDefault(); const q=$('#q'); if(q) q.focus();
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='l' && S.encrypted){ e.preventDefault(); lock(false); }
}

function allTags(){
  const m=new Map();
  S.entries.forEach(en=>(en.tags||[]).forEach(t=>m.set(t,(m.get(t)||0)+1)));
  return Array.from(m.keys()).sort((a,b)=>a.localeCompare(b));
}

function filtered(){
  const q=S.q.trim().toLowerCase();
  let out=S.entries.filter(e=>{
    if(S.tag && !(e.tags||[]).includes(S.tag)) return false;
    if(!q) return true;
    return [e.name,e.issuer,e.app,e.stack,e.url,e.notes,(e.tags||[]).join(' ')]
      .some(v=>String(v||'').toLowerCase().includes(q));
  });
  const by=S.sort;
  out.sort((a,b)=>{
    if(by==='expires'){
      const av=a.expires||'9999-99-99', bv=b.expires||'9999-99-99';
      return av.localeCompare(bv) || String(a.name||'').localeCompare(String(b.name||''));
    }
    if(by==='updated') return String(b.updated||'').localeCompare(String(a.updated||''));
    const av=String(a[by]||'~').toLowerCase(), bv=String(b[by]||'~').toLowerCase();
    return av.localeCompare(bv) || String(a.name||'').localeCompare(String(b.name||''));
  });
  return out;
}

function expiryBadge(e){
  const d=daysUntil(e.expires);
  if(d===null) return '';
  if(d<0)  return '<span class="badge exp">expired</span>';
  if(d<=30) return '<span class="badge soon">'+(d===0?'expires today':d+'d left')+'</span>';
  return '';
}

function renderList(){
  const tagbar=$('#tags'), list=$('#list');
  const tags=allTags();
  tagbar.innerHTML = tags.length
    ? tags.map(t=>'<button class="chip'+(S.tag===t?' on':'')+'" data-tag="'+esc(t)+'">'+esc(t)+'</button>').join('')
      + (S.tag?'<button class="chip" data-tag="">clear</button>':'')
    : '';
  $$('[data-tag]',tagbar).forEach(b=>b.addEventListener('click',()=>{
    const t=b.dataset.tag; S.tag = (!t || S.tag===t) ? null : t;
    renderList();
  }));

  const rows=filtered();
  $('#count').textContent = S.entries.length===0 ? '' :
    rows.length+' of '+S.entries.length+' key'+(S.entries.length===1?'':'s');

  if(!S.entries.length){
    list.innerHTML='<div class="empty">'+svg('inbox')+'<h3>Nothing stored yet</h3><div>Add your first key — Portainer, Sonarr, Radarr, whatever needs one.</div></div>';
    return;
  }
  if(!rows.length){ list.innerHTML='<div class="empty">'+svg('search')+'<h3>No matches</h3><div>Nothing here matches that search.</div></div>'; return; }

  list.innerHTML = rows.map(rowHTML).join('');
  $$('.rhead',list).forEach(h=>h.addEventListener('click',ev=>{
    if(ev.target.closest('.ract')) return;
    const id=h.parentNode.dataset.id;
    S.open.has(id)?S.open.delete(id):S.open.add(id);
    renderList();
  }));
  $$('[data-copy]',list).forEach(b=>b.addEventListener('click',async ev=>{
    ev.stopPropagation();
    const e=S.entries.find(x=>x.id===b.dataset.id);
    if(!e) return;
    const val=e[b.dataset.copy];
    if(!val){ toast('Nothing to copy'); return; }
    const ok=await copyText(val);
    if(ok){
      const old=b.innerHTML; b.innerHTML=svg('check'); b.classList.add('ok');
      setTimeout(()=>{b.innerHTML=old;b.classList.remove('ok');},1100);
      toast('Copied '+b.dataset.label);
      if(b.dataset.copy==='key'||b.dataset.copy==='secret') scheduleClipboardClear();
    } else toast('Copy failed — select and copy manually');
  }));
  $$('[data-reveal]',list).forEach(b=>b.addEventListener('click',ev=>{
    ev.stopPropagation();
    const k=b.dataset.reveal;
    S.shown.has(k)?S.shown.delete(k):S.shown.add(k);
    renderList();
  }));
  $$('[data-edit]',list).forEach(b=>b.addEventListener('click',ev=>{ ev.stopPropagation(); entryForm(b.dataset.edit); }));
  $$('[data-del]',list).forEach(b=>b.addEventListener('click',ev=>{ ev.stopPropagation(); confirmDelete(b.dataset.del); }));
}

function secretField(e, field, label){
  const v=e[field]; if(!v) return '';
  const k=e.id+':'+field, shown=S.shown.has(k);
  return '<div class="fld"><div class="k">'+label+'</div>'+
    '<div class="v secret">'+(shown?esc(v):'•'.repeat(Math.min(String(v).length,44)))+'</div>'+
    '<div class="a">'+
      '<button class="iconbtn" data-reveal="'+esc(k)+'" title="'+(shown?'Hide':'Reveal')+'">'+svg(shown?'eyeoff':'eye')+'</button>'+
      '<button class="iconbtn" data-id="'+esc(e.id)+'" data-copy="'+field+'" data-label="'+label.toLowerCase()+'" title="Copy '+label.toLowerCase()+'">'+svg('copy')+'</button>'+
    '</div></div>';
}
function plainField(e, field, label, isLink){
  const v=e[field]; if(!v) return '';

/* ---------------- export / import ---------------- */
function download(filename, text, mime){
  const blob=new Blob([text],{type:mime||'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },0);
}
function stamp(){ return new Date().toISOString().slice(0,16).replace(/[:T]/g,'-'); }

function exportEncrypted(){
  if(!S.rec || S.rec.enc===false){ toast('Vault is not encrypted — use plain JSON export'); return; }
  download('keyring-backup-'+stamp()+'.json', JSON.stringify(S.rec,null,2));
  toast('Encrypted backup downloaded');
}

  openModal('<div class="modal" style="max-width:440px"><div class="mhead">'+svg('alert')+'<h2>Export plain JSON</h2></div>'+

  $('#yes').addEventListener('click',()=>{

    closeModal(); toast('Plain export downloaded');

}

function importModal(){
  openModal('<div class="modal" style="max-width:480px"><div class="mhead">'+svg('up')+'<h2>Import</h2><button class="iconbtn" data-close>'+svg('x')+'</button></div>'+
    '<div class="mbody">'+
      '<label class="f"><span class="lab">Backup file</span><input id="i_file" type="file" accept="application/json,.json"></label>'+
      '<label class="f" id="i_pwwrap" style="display:none"><span class="lab">Master password of that backup</span><div class="pwwrap"><input id="i_pw" type="password" spellcheck="false"><button class="iconbtn" data-peek="i_pw" type="button">'+svg('eye')+'</button></div></label>'+
      '<label class="f"><span class="lab">Mode</span><select id="i_mode">'+
        '<option value="merge">Merge — keep what is here, add what is new</option>'+
        '<option value="replace">Replace — wipe this vault first</option>'+
      '</select></label>'+
      '<div class="err" id="ierr"></div><div class="hint" id="ihint"></div>'+
    '</div><div class="mfoot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="i_go" disabled>Import</button></div></div>');
  wirePeek();
  let parsed=null;
  $('#i_file').addEventListener('change',ev=>{
    const f=ev.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        parsed=JSON.parse(r.result);
        const isEnc = parsed && parsed.enc===true && parsed.kdf && parsed.ct;
        $('#i_pwwrap').style.display = isEnc?'block':'none';
        const n = isEnc ? null : (parsed.entries||(Array.isArray(parsed)?parsed:null)||[]).length;
        $('#ihint').textContent = isEnc ? 'Encrypted backup — enter its master password.' : (n+' key'+(n===1?'':'s')+' found in this file.');
        $('#ierr').textContent=''; $('#i_go').disabled=false;
      }catch(e){ parsed=null; $('#ierr').textContent='That is not valid JSON.'; $('#i_go').disabled=true; }
    };
    r.readAsText(f);
  });
  $('#i_go').addEventListener('click',async()=>{
    if(!parsed) return;
    let incoming=null;
    try{
      if(parsed.enc===true){
        if(!HAS_CRYPTO) throw new Error('nocrypto');
        const k=await deriveKey($('#i_pw').value, ub64(parsed.kdf.salt), parsed.kdf.iterations||KDF_ITER);
        const p=await decryptPayload(k, parsed.iv, parsed.ct);
        incoming=p.entries||[];
      } else {
        incoming = parsed.entries || (Array.isArray(parsed)?parsed:null);
      }
    }catch(e){ $('#ierr').textContent = e.message==='nocrypto' ? 'WebCrypto unavailable here — cannot decrypt.' : 'Wrong password for that backup.'; return; }
    if(!Array.isArray(incoming)){ $('#ierr').textContent='No entries found in that file.'; return; }

    const clean = incoming.filter(x=>x&&typeof x==='object').map(x=>({
      id: x.id||uid(), name:String(x.name||'(untitled)'), issuer:String(x.issuer||''),
      app:String(x.app||''), key:String(x.key||''), secret:String(x.secret||''),
      url:String(x.url||''), stack:String(x.stack||''),
      tags:Array.isArray(x.tags)?x.tags.map(String):(x.tags?String(x.tags).split(',').map(s=>s.trim()).filter(Boolean):[]),
      created:String(x.created||''), expires:String(x.expires||''), notes:String(x.notes||''),
      updated:String(x.updated||new Date().toISOString())
    }));
    if($('#i_mode').value==='replace'){
      const now=new Date().toISOString();
      const keep=new Set(clean.map(e=>e.id));
      S.entries.forEach(e=>{ if(!keep.has(e.id)) S.deleted.push({id:e.id, at:now}); });
      S.entries=clean;
    }
    else {
      const seen=new Set(S.entries.map(e=>e.id));
      clean.forEach(e=>{ if(seen.has(e.id)) e.id=uid(); S.entries.push(e); });
    }
    await persist(); closeModal(); renderList();
    toast('Imported '+clean.length+' key'+(clean.length===1?'':'s'));
  });
}

  openModal('<div class="modal" style="max-width:440px"><div class="mhead">'+svg('lock')+'<h2>'+(enabling?'Enable encryption':'Change master password')+'</h2><button class="iconbtn" data-close>'+svg('x')+'</button></div>'+

      (enabling?'':'<label class="f"><span class="lab">Current password</span><div class="pwwrap"><input id="c_old" type="password" spellcheck="false"><button class="iconbtn" data-peek="c_old" type="button">'+svg('eye')+'</button></div></label>')+
      '<label class="f"><span class="lab">New password</span><div class="pwwrap"><input id="c_a" type="password" spellcheck="false"><button class="iconbtn" data-peek="c_a" type="button">'+svg('eye')+'</button></div></label>'+
      '<label class="f"><span class="lab">Confirm</span><div class="pwwrap"><input id="c_b" type="password" spellcheck="false"><button class="iconbtn" data-peek="c_b" type="button">'+svg('eye')+'</button></div></label>'+
      '<div class="err" id="cerr"></div>'+
      '<div class="hint">Old encrypted backups still open with the old password — they are separate files.</div>'+
    '</div><div class="mfoot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="c_go">'+svg('check')+'Save</button></div></div>');
  wirePeek();
  $('#c_go').addEventListener('click',async()=>{
    const err=$('#cerr'); const a=$('#c_a').value, b=$('#c_b').value;
    if(a.length<8){ err.textContent='Use at least 8 characters.'; return; }
    if(a!==b){ err.textContent='The two passwords do not match.'; return; }
    if(!enabling){
      try{ await decryptPayload(await deriveKey($('#c_old').value, ub64(S.rec.kdf.salt), S.rec.kdf.iterations||KDF_ITER), S.rec.iv, S.rec.ct); }
      catch(e){ err.textContent='Current password is wrong.'; return; }
    }
    const salt=crypto.getRandomValues(new Uint8Array(16));
    S.rec={v:1, enc:true, kdf:{salt:b64(salt), iterations:KDF_ITER, hash:'SHA-256'}, iv:'', ct:''};
    S.key=await deriveKey(a, salt, KDF_ITER);
    S.encrypted=true;
    await persist(); closeModal(); renderApp(); resetIdle(); startPoll();
    toast(enabling?'Vault encrypted':'Master password changed');
  });
}

      '</div>'+

    }

/* ---------------- sync UI ---------------- */
async function manualSync(){
  if(!SYNC.supported){ toast('No sync server on this origin'); return; }
  if(!SYNC.on){ toast('Sync is paused'); return; }
  SYNC.busy=true; paintBadge();
  try{
    const remote=await syncPull();
    if(remote && remote.enc===true && S.key){
      try{
        const rp=await decryptPayload(S.key, remote.iv, remote.ct);
        const merged=mergePayloads(rp, payloadNow());
        S.entries=merged.entries; S.deleted=merged.deleted;
        if($('#list')) renderList();
      }catch(e){
        SYNC.busy=false; paintBadge();
        conflictModal(remote); return;
      }
    }
    SYNC.busy=false;
    await persist();
    await syncPush();
    if(SYNC.status==='ok') toast('Synced');
  }catch(e){ SYNC.status='offline'; toast('Sync server unreachable'); }
  SYNC.busy=false; paintBadge();
}

      '<button class="btn" id="k_srv">Use the server copy</button>'+

  $('#k_srv').addEventListener('click',()=>{
    saveRecord(remote); SYNC.remote=remote;
    clearInterval(pollT);
    S.key=null; S.entries=[]; S.deleted=[];
    closeModal(); renderGate(); startPoll();
    toast('Unlock with the password for the server copy');
  });
  $('#k_mine').addEventListener('click',async()=>{
    SYNC.rev = SYNC.rev || '*';
    const r=await putRecord();
    if(r.ok){ SYNC.rev=r.headers.get('ETag'); SYNC.status='ok'; toast('Server overwritten'); }
    else toast('Could not write to server');
    closeModal(); paintBadge();
  });
}

function syncModal(){
  const i=badgeInfo();
  openModal('<div class="modal" style="max-width:480px"><div class="mhead">'+svg('link')+'<h2>Sync</h2><button class="iconbtn" data-close>'+svg('x')+'</button></div>'+
    '<div class="mbody">'+
      '<div style="display:flex;align-items:center;gap:9px;margin-bottom:18px">'+
        '<span style="width:9px;height:9px;border-radius:50%;background:'+i.c+';flex:none"></span>'+
        '<span style="font-weight:600">'+esc(i.t)+'</span></div>'+
      (SYNC.supported?'':'<div class="banner warn" style="margin-bottom:16px">'+svg('alert')+
        '<div><b>No sync server here</b>'+(location.protocol==='file:'
          ? 'This page was opened straight from disk, so there is nothing to sync with. Serve it from the stack to sync.'
          : 'Nothing answered at <code>'+esc(SYNC.base)+'</code> on this origin.')+'</div></div>')+
      '<label class="f"><span class="lab">Server endpoint</span><input id="y_base" type="text" class="mono" value="'+esc(SYNC.base)+'" spellcheck="false"><div class="hint">Same-origin path, or a full URL if the API lives elsewhere.</div></label>'+
      '<label class="f"><span class="lab">Access token '+(SYNC.token?'':'<span style="color:var(--fg3);font-weight:400">— only if KEYRING_TOKEN is set</span>')+'</span><div class="pwwrap"><input id="y_tok" type="password" value="'+esc(SYNC.token)+'" spellcheck="false" autocomplete="off"><button class="iconbtn" data-peek="y_tok" type="button">'+svg('eye')+'</button></div></label>'+
      '<label style="display:flex;gap:9px;align-items:center;cursor:pointer;margin-bottom:6px"><input type="checkbox" id="y_on" style="width:auto"'+(SYNC.on!==false?' checked':'')+'><span>Keep this browser in sync</span></label>'+
      '<div class="hint">The server stores the encrypted blob and nothing else. It cannot read your keys, with or without a token — the token only stops strangers on the network overwriting the blob.</div>'+
      '<div class="err" id="yerr"></div>'+
    '</div>'+
    '<div class="mfoot"><button class="btn" data-close>Close</button>'+
      '<button class="btn" id="y_test">Test</button>'+
      '<button class="btn primary" id="y_save">'+svg('check')+'Save &amp; sync</button></div></div>');
  wirePeek();
  const read=()=>{ SYNC.base=$('#y_base').value.trim()||'/api/vault'; SYNC.token=$('#y_tok').value; SYNC.on=$('#y_on').checked; saveSyncCfg(); };
  $('#y_test').addEventListener('click',async()=>{
    read();
    const err=$('#yerr'); err.style.color='var(--fg2)'; err.textContent='Testing…';
    try{
      const r=await syncProbe();
      err.style.color = r.status===401?'var(--bad)':'var(--ok)';
      err.textContent = r.status===401 ? 'Reachable, but the token was rejected.'
        : r.status===200 ? 'Reachable — a vault is already stored there.'
        : r.status===404 ? 'Reachable — no vault stored yet.'
        : 'Reachable — unexpected status '+r.status;
    }catch(e){
      err.style.color='var(--bad)';
      err.textContent = e.message==='notapi' ? 'Something answered, but it is not a Keyring sync server.' : 'Could not reach that endpoint.';
    }
  });
  $('#y_save').addEventListener('click',async()=>{
    read(); closeModal();
    await syncInit();
    paintBadge(); startPoll();
    if(SYNC.on && SYNC.supported) manualSync(); else toast('Sync paused');
  });
}

/* ---------------- boot ---------------- */
(async function boot(){
  applyTheme(currentTheme());
  await syncInit();
  renderGate();
  startPoll();
})();
</script>
</body>
</html>
